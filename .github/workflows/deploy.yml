name: Deploy to Live Server

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel (FTPS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: 📂 Sync files to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'conference.shaheengroup.org' }}
          username: ${{ secrets.FTP_USERNAME || secrets.SECRET_NAME || 'github@conference.shaheengroup.org' }}
          password: ${{ secrets.FTP_PASSWORD || secrets.SECRET_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
